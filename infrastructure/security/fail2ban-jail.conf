# Fail2ban jail for jet.sygn.live
# Add to /etc/fail2ban/jail.local

[sygn-admin]
enabled = true
port = http,https
filter = sygn-admin
logpath = /var/log/nginx/jet.sygn.live.access.log
maxretry = 3
findtime = 600
bantime = 86400
action = iptables-multiport[name=sygn-admin, port="http,https"]

[sygn-admin-aggressive]
enabled = true
port = http,https
filter = sygn-admin
logpath = /var/log/nginx/jet.sygn.live.access.log
maxretry = 1
findtime = 3600
bantime = 604800
action = iptables-multiport[name=sygn-admin-aggressive, port="http,https"]
